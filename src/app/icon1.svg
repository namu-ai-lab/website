<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The Namu Blossom on its cream tile (after namu-icon-app-on-cream), stroked a little heavier so it reads at 16 px.
       The tile carries its own ground, so the mark shows on light and dark tab bars alike. -->
  <rect width="64" height="64" rx="14" fill="#F7F0E3"/>
  <path d="M 51 31 A 19 19 0 1 0 32 50" stroke="#1C1410" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <circle cx="32" cy="50" r="5.5" fill="#E8935A"/>
</svg>
