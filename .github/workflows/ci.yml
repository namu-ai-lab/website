# Runs on every pull request and on every push to main. A red run should block the merge (branch protection on main,
# requiring both jobs). Nothing here needs a secret: the site builds without .env (account pages and live demos say
# they are not configured), and the gateway tests use fakes for the database, Modal and the models.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request or branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web · typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  platform:
    name: Platform · gateway tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"      # as in the gateway's Modal image
          cache: pip
          cache-dependency-path: platform/requirements-dev.txt
      - run: python -m pip install -r platform/requirements-dev.txt
      - run: python -m pytest platform/tests -q
